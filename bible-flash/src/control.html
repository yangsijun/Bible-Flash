<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Bible Flash</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h1>Bible Flash</h1>

    <form id="reference-form" autocomplete="off">
      <div class="search">
        <input id="verse-text-input" type="text" placeholder="예: 요 3:16, 요한복음 3장 16절, ㅇㅎ"
          role="combobox" aria-controls="suggestions" aria-expanded="false" aria-autocomplete="list" />
        <ul id="suggestions" role="listbox" hidden></ul>
      </div>
      <button id="submit-button" type="submit">표시</button>
    </form>
    <p id="message" role="status"></p>

    <form onsubmit="return false;">
      <div>
        <select name="book-select" id="book-select" class="select"></select>
        <label for="book-select" id="book-select-label" class="select-label">성경</label>
        <select name="chapter-select" id="chapter-select" class="select"></select>
        <label for="chapter-select" class="select-label">장</label>
        <select name="verse-select" id="verse-select" class="select"></select>
        <label for="verse-select" class="select-label">절</label>
      </div>
    </form>

    <div>
      <button id="prev-btn" type="button">이전</button>
      <button id="next-btn" type="button">다음</button>
    </div>

    <script src="bookSearch.js"></script>
    <script src="control.js"></script>
  </body>
</html>
